<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐭 鼠寶的濟州島大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --d1:#f0962f; --d2:#5b8fd6; --d3:#b06aa6; --d4:#54ada3;
    --ov:#e0863c;
    --cream:#fbf4e4; --cream2:#f4e8cf; --ink:#5b4636; --ink2:#8a7660;
    --sea:#8fd6da; --land:#bfe39a;
    --line:#e7d6b3; --gold:#f5a623;
    --shadow:0 10px 28px rgba(120,90,50,.18);
    font-family:"Noto Sans TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(circle at 18% 12%, #fff7e8 0%, transparent 45%),
      radial-gradient(circle at 85% 88%, #fdeccf 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    height:100vh;overflow:hidden;
    padding:14px 18px;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:radial-gradient(rgba(180,140,80,.10) 1.2px, transparent 1.4px);
    background-size:22px 22px;
  }
  .wrap{max-width:1320px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:1}

  /* ---------- header ---------- */
  header{text-align:center;flex:none;margin-bottom:10px}
  .ttl{
    font-family:"Fredoka","Noto Sans TC",sans-serif;font-weight:700;
    font-size:clamp(22px,3.4vw,36px);color:var(--ink);letter-spacing:.5px;line-height:1;
    text-shadow:2px 2px 0 #fff, 3px 4px 0 rgba(224,134,60,.18);
    display:inline-flex;align-items:center;gap:10px;
  }
  .ttl .mouse{display:inline-block;animation:wiggle 3.5s ease-in-out infinite;transform-origin:bottom center}
  @keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(12deg)}}
  .sub{
    margin-top:6px;font-size:13px;color:var(--ink2);font-weight:500;
    display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:#fff;padding:5px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(150,110,60,.12);border:2px solid #fff;
  }
  .sub b{color:var(--d1)}
  .dot-sep{width:5px;height:5px;border-radius:50%;background:var(--line)}

  /* ---------- main row ---------- */
  .main{flex:1;min-height:0;display:flex;gap:14px}

  /* ---------- board ---------- */
  .board{
    flex:1;min-width:0;min-height:0;position:relative;
    background:linear-gradient(160deg,#fffaf0,#f7ecd6);border-radius:26px;padding:12px;
    box-shadow:var(--shadow), inset 0 0 0 3px #fff, inset 0 0 0 7px var(--cream2);
    border:3px solid #e9d8b6;display:flex;align-items:center;justify-content:center;
  }
  .board::after{content:"";position:absolute;inset:11px;border-radius:18px;pointer-events:none;border:2px dashed #e3cfa3;opacity:.7}
  .corner{position:absolute;font-size:22px;opacity:.85;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
  .corner.tl{top:5px;left:10px;transform:rotate(-12deg)}
  .corner.tr{top:5px;right:10px;transform:rotate(12deg)}
  .corner.bl{bottom:5px;left:10px;transform:rotate(12deg)}
  .corner.br{bottom:5px;right:10px;transform:rotate(-12deg)}
  svg.map{width:100%;height:100%;display:block}

  /* spots */
  .spot{cursor:pointer;transition:opacity .4s ease, filter .4s ease}
  .spot .ring{transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
  .spot:hover .ring,.spot.hl .ring{transform:scale(1.16)}
  .spot:hover,.spot.hl{filter:drop-shadow(0 4px 6px rgba(90,60,30,.25))}
  .spot.dim{opacity:.3;filter:saturate(.3) blur(.2px)}
  .spot-inner{transform-box:fill-box;transform-origin:center}
  .pulse{transform-box:fill-box;transform-origin:center}
  .spot.active .pulse{animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.8);opacity:.55}100%{transform:scale(2.1);opacity:0}}
  .spot-label{font-family:"Noto Sans TC";font-weight:700;font-size:13px;fill:var(--ink);
    paint-order:stroke;stroke:#fffaf0;stroke-width:3.4px;stroke-linejoin:round;pointer-events:none}
  .spot-emoji{font-size:21px;pointer-events:none}
  .badge-tx{font-family:"Noto Sans TC";font-weight:700;font-size:10.5px;fill:#fff;pointer-events:none}
  .spot.pop .spot-inner{animation:pop .55s cubic-bezier(.34,1.56,.64,1) backwards}
  @keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

  /* token */
  #tokenArt{transform-box:fill-box;transform-origin:bottom center;animation:bob 1.6s ease-in-out infinite}
  #token.moving #tokenArt{animation:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* stationary celebration (when 鼠寶 doesn't travel) */
  #token.cheer #tokenArt{animation:cheer .72s cubic-bezier(.34,1.56,.64,1)}
  @keyframes cheer{
    0%{transform:translateY(0) rotate(0)}
    24%{transform:translateY(-17px) rotate(-9deg)}
    46%{transform:translateY(0) rotate(0)}
    66%{transform:translateY(-9px) rotate(7deg)}
    84%{transform:translateY(-1px) rotate(-3deg)}
    100%{transform:translateY(0) rotate(0)}
  }
  #tokenSpark{transform-box:fill-box;transform-origin:center;opacity:0}
  #token.cheer #tokenSpark{animation:spark .72s ease}
  @keyframes spark{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.9)}}
  #tokenFlag{transform-box:fill-box;transform-origin:left center;animation:flagwave 1.3s ease-in-out infinite}
  @keyframes flagwave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.93)}}
  .float{animation:drift 9s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}

  /* ---------- side panel ---------- */
  .panel{flex:0 0 348px;min-height:0;display:flex;flex-direction:column;
    background:rgba(255,253,247,.96);border:3px solid #ecdcb8;border-radius:24px;
    box-shadow:var(--shadow);overflow:hidden}
  .p-head{flex:none;padding:14px 16px 12px;border-bottom:2px dashed #ecdcb8;position:relative;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent,#888) 13%,#fffdf7),#fffdf7)}
  .p-head .ph-top{display:flex;align-items:baseline;gap:9px}
  .p-head .ph-day{font-family:"Fredoka";font-weight:700;font-size:24px;color:var(--accent,#888);line-height:1}
  .p-head .ph-date{font-weight:700;font-size:14px;color:var(--ink)}
  .p-head .ph-theme{font-size:13px;color:var(--ink);font-weight:600;margin-top:6px}
  .p-head .ph-wx{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent,#888);
    padding:2px 10px;border-radius:999px;margin-top:8px}
  .p-head .ph-note{margin-top:9px;font-size:11.5px;color:var(--ink2);line-height:1.5}
  .p-head .ph-note b{color:var(--accent)}

  .cards{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px}
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-thumb{background:#e3cfa3;border-radius:99px}
  .cards::-webkit-scrollbar-track{background:transparent}

  .scard{flex:none;border:2px solid #f0e6cf;border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;animation:cardin .45s backwards}
  @keyframes cardin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  .scard:hover,.scard.focus{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--c,#999) 28%,transparent);border-color:var(--c,#999)}
  .scard-photo{height:74px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scard-photo::after{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.3px);background-size:13px 13px;opacity:.35}
  .scard-photo .hero{font-size:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));z-index:1}
  .scard-photo .deco{position:absolute;font-size:15px;opacity:.65}
  .scard-photo .deco.a{top:8px;left:12px}.scard-photo .deco.b{bottom:8px;right:14px;font-size:13px}
  .chip{position:absolute;z-index:2;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;backdrop-filter:blur(2px)}
  .chip.time{top:7px;right:8px;background:rgba(255,255,255,.92);color:var(--ink)}
  .chip.kind{top:7px;left:8px;color:#fff}

  .scard-body{padding:10px 12px 12px}
  .scard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sname{font-weight:900;font-size:14.5px;color:var(--ink);line-height:1.2}
  .rate{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:#caa23a;white-space:nowrap;flex:none}
  .rate .star{color:var(--gold);font-size:14px}
  .rate .cnt{color:var(--ink2);font-weight:600;font-size:10.5px}
  .rate.none{font-size:11px;color:#b08bbf;background:#f6eefa;padding:2px 9px;border-radius:999px}
  .src{font-size:9.5px;color:#b3a489;font-weight:600;margin-top:2px;text-align:right}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 6px}
  .tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--c,#999) 13%,#fff);color:color-mix(in srgb,var(--c,#999) 70%,#333)}
  .sdesc{font-size:12px;color:var(--ink2);line-height:1.55}

  /* combo (擇一/不可組) card */
  .combo{flex:none;border:2.5px solid var(--accent,#5b8fd6);border-radius:16px;padding:11px 12px 12px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent,#5b8fd6) 10%,#fff),#fff);
    box-shadow:0 6px 16px color-mix(in srgb,var(--accent,#5b8fd6) 18%,transparent);animation:cardin .45s backwards}
  .combo .cmb-h{font-weight:900;font-size:13.5px;color:var(--accent,#5b8fd6);line-height:1.25}
  .combo .cmb-sub{font-size:11px;color:var(--ink2);line-height:1.5;margin:5px 0 9px}
  .combo .cmb-sub b{color:var(--accent)}
  .cmb-row{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:11px;margin-bottom:6px}
  .cmb-row:last-child{margin-bottom:0}
  .cmb-row.ok{background:color-mix(in srgb,var(--accent,#5b8fd6) 9%,#fff);border:1.5px solid color-mix(in srgb,var(--accent,#5b8fd6) 28%,#fff)}
  .cmb-row.bad{background:#fdedec;border:1.5px solid #f3b6b0}
  .cmb-tag{flex:none;font-weight:800;font-size:11px;color:#fff;background:var(--accent,#5b8fd6);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .cmb-x{flex:none;font-weight:800;font-size:11px;color:#fff;background:#d9534f;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .cmb-d{font-size:11.5px;color:var(--ink);line-height:1.45}

  /* overview day cards */
  .ovcard{flex:none;display:flex;align-items:center;gap:12px;padding:12px;border:2px solid #f0e6cf;border-radius:16px;
    background:#fff;cursor:pointer;transition:.18s;animation:cardin .45s backwards}
  .ovcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 25%,transparent);border-color:var(--c)}
  .ovcard .ov-em{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;
    background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 10%,#fff))}
  .ovcard .ov-d{font-family:"Fredoka";font-weight:700;font-size:16px;color:var(--c);line-height:1}
  .ovcard .ov-t{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:3px}
  .ovcard .ov-s{font-size:11px;color:var(--ink2);margin-top:2px}

  /* ---------- switcher ---------- */
  .switch{flex:none;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:11px}
  .day-btn{cursor:pointer;background:#fff;border-radius:16px;padding:8px 15px 9px;
    box-shadow:0 4px 0 #e8d8b6, 0 8px 16px rgba(150,110,60,.13);transition:transform .14s ease, box-shadow .14s ease;
    display:flex;flex-direction:column;align-items:center;gap:1px;min-width:90px;position:relative;border:2.5px solid transparent}
  .day-btn:hover{transform:translateY(-2px)}
  .day-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e8d8b6}
  .day-btn .db-d{font-family:"Fredoka";font-weight:700;font-size:16px;line-height:1;color:var(--ink)}
  .day-btn .db-sm{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px}
  .day-btn.on{border-color:var(--c);box-shadow:0 4px 0 var(--c), 0 8px 18px color-mix(in srgb,var(--c) 40%, transparent);transform:translateY(-2px)}
  .day-btn.on .db-d{color:var(--c)}
  .day-btn .pin{position:absolute;top:-11px;right:-9px;font-size:17px;opacity:0;transform:scale(.4) rotate(-20deg);transition:.2s}
  .day-btn.on .pin{opacity:1;transform:scale(1) rotate(0)}

  .hint{flex:none;text-align:center;font-size:11.5px;color:var(--ink2);margin-top:8px;font-weight:500}
  .hint kbd{background:#fff;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-family:"Fredoka";font-size:10.5px}
  .hint .heart{color:#e8728f}

  @media(max-width:900px){
    body{height:auto;overflow:auto}
    .wrap{height:auto}
    .main{flex-direction:column}
    .board{aspect-ratio:5/3}
    .panel{flex:none;max-height:none}
    .cards{overflow:visible}
    .day-btn{min-width:0;padding:8px 11px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="ttl"><span class="mouse">🐭</span> 鼠寶的濟州島大冒險</h1>
    <div class="sub">
      <span>📅 <b>2026.6.17–6.20</b></span><span class="dot-sep"></span>
      <span>🌸 繡球花 × 海景 × 吃吃喝喝</span><span class="dot-sep"></span>
      <span>🚗 樂天租車自駕</span>
    </div>
  </header>

  <div class="main">
    <!-- BOARD -->
    <div class="board">
      <span class="corner tl">🍊</span><span class="corner tr">🌸</span>
      <span class="corner bl">🌊</span><span class="corner br">🐷</span>

      <svg class="map" id="map" viewBox="0 0 1000 600" aria-label="濟州島行程地圖" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a6e4e7"/><stop offset="0.55" stop-color="#84d2d8"/><stop offset="1" stop-color="#65bfc8"/>
          </linearGradient>
          <linearGradient id="landG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d6efad"/><stop offset="0.6" stop-color="#b6dd88"/><stop offset="1" stop-color="#9ccf72"/>
          </linearGradient>
          <radialGradient id="mtnG" cx="0.5" cy="0.2" r="0.9"><stop offset="0" stop-color="#a9d27a"/><stop offset="1" stop-color="#7bb259"/></radialGradient>
          <radialGradient id="headG" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#dfe2e8"/><stop offset="1" stop-color="#bcc1cb"/></radialGradient>
          <pattern id="waves" width="64" height="34" patternUnits="userSpaceOnUse">
            <path d="M0 22 Q16 12 32 22 T64 22" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.22" stroke-linecap="round"/>
          </pattern>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a6b6e" flood-opacity="0.22"/></filter>
          <filter id="softS" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6b5a3a" flood-opacity="0.28"/></filter>
        </defs>

        <rect x="0" y="0" width="1000" height="600" fill="url(#seaG)"/>
        <rect x="0" y="0" width="1000" height="600" fill="url(#waves)"/>

        <g opacity="0.9">
          <text x="120" y="110" font-size="30" class="float">☁️</text>
          <text x="700" y="540" font-size="26" class="float" style="animation-delay:-3s">☁️</text>
          <text x="60" y="470" font-size="24">🐬</text>
          <text x="470" y="80" font-size="22" class="float" style="animation-delay:-5s">⛵</text>
        </g>

        <g filter="url(#soft)">
          <path d="M88,302 C112,214 250,150 432,150 C566,150 668,134 768,162 C868,190 942,236 934,300 C928,360 842,440 700,470 C560,496 416,500 296,476 C176,452 70,398 88,302 Z" fill="url(#landG)" stroke="#f1e2bd" stroke-width="7"/>
          <path d="M88,302 C112,214 250,150 432,150 C566,150 668,134 768,162 C868,190 942,236 934,300 C928,360 842,440 700,470 C560,496 416,500 296,476 C176,452 70,398 88,302 Z" fill="none" stroke="#8cc063" stroke-width="2" opacity="0.5"/>
        </g>
        <g filter="url(#soft)"><ellipse cx="965" cy="172" rx="34" ry="22" fill="url(#landG)" stroke="#f1e2bd" stroke-width="5"/></g>

        <g>
          <path d="M470,330 Q500,250 530,330 Z" fill="url(#mtnG)" stroke="#79ad57" stroke-width="2"/>
          <circle cx="500" cy="298" r="7" fill="#86b65f" stroke="#6d9a4b" stroke-width="2"/>
          <text x="500" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5f7f43" style="paint-order:stroke;stroke:#e9f4cf;stroke-width:3px">漢拏山</text>
          <text x="430" y="300" font-size="18">🌳</text><text x="600" y="300" font-size="18">🍊</text>
          <text x="560" y="430" font-size="16">🌸</text><text x="250" y="350" font-size="15">🌼</text><text x="660" y="380" font-size="16">🐷</text>
        </g>

        <g id="routesFaint" fill="none" stroke="#7a6a4d" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.5 12" opacity="0.28"></g>
        <path id="activeRoad" fill="none" stroke="#fff7ea" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></path>
        <path id="activeRoute" fill="none" stroke-linecap="round" stroke-width="6" stroke-dasharray="0.1 16"></path>
        <path id="travelPath" fill="none" stroke="none" opacity="0"></path>

        <text x="315" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#c2622a" style="paint-order:stroke;stroke:#fffaf0;stroke-width:3px">出發 / 回家</text>

        <g id="spots"></g>

        <!-- 鼠寶 token -->
        <g id="token">
          <ellipse cx="0" cy="3" rx="13" ry="4.5" fill="#3a5b3a" opacity="0.18"/>
          <g id="tokenSpark" pointer-events="none">
            <text x="-22" y="-58" font-size="13">✨</text>
            <text x="20" y="-66" font-size="11">✨</text>
            <text x="24" y="-40" font-size="12">💕</text>
            <text x="-26" y="-38" font-size="10">✨</text>
          </g>
          <g id="tokenLean"><g id="tokenArt">
            <rect x="-2" y="-50" width="4" height="50" rx="2" fill="#a06c43"/>
            <circle cx="0" cy="0" r="3.5" fill="#a06c43"/>
            <path id="tokenFlag" d="M0,-46 L24,-40 L0,-33 Z" fill="#f0962f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
            <g transform="translate(0,-64)">
              <circle cx="-11" cy="-9" r="8.5" fill="#c4c8d1" stroke="#fff" stroke-width="1.5"/>
              <circle cx="11" cy="-9" r="8.5" fill="#c4c8d1" stroke="#fff" stroke-width="1.5"/>
              <circle cx="-11" cy="-9" r="4.2" fill="#ffc2d4"/><circle cx="11" cy="-9" r="4.2" fill="#ffc2d4"/>
              <circle cx="0" cy="0" r="14.5" fill="url(#headG)" stroke="#fff" stroke-width="1.5"/>
              <ellipse cx="-7.5" cy="4.5" rx="3" ry="2" fill="#ffb0c6" opacity="0.85"/><ellipse cx="7.5" cy="4.5" rx="3" ry="2" fill="#ffb0c6" opacity="0.85"/>
              <circle cx="-5" cy="-1" r="2.1" fill="#3a3a44"/><circle cx="5" cy="-1" r="2.1" fill="#3a3a44"/>
              <circle cx="-4.3" cy="-1.7" r="0.7" fill="#fff"/><circle cx="5.7" cy="-1.7" r="0.7" fill="#fff"/>

function smoothPath(pts){
  if(pts.length<2) return '';
  let d=`M ${pts[0].x} ${pts[0].y}`; const t=0.16;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)*t, c1y=p1.y+(p2.y-p0.y)*t;

    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
  }
  return d;
}

const token=$('#token'), tokenLean=$('#tokenLean'), tokenFlag=$('#tokenFlag');
const travel=$('#travelPath');

let anim=null, cheerTimer=null;
const SPEED=210;        // px per second — 統一移動速度（長路線就自然跑久一點）
const HOP_EVERY=46;     // 每走過這麼多 px 蹦一下（跳動頻率綁距離，與路線長短無關）

function cheerInPlace(at,onDone){
  // 原地不動：放歡呼動畫，不要原地抖
  const p = at || cur;
  token.classList.remove('moving');
  tokenLean.setAttribute('transform','rotate(0)');
  token.setAttribute('transform',`translate(${p.x},${p.y})`);
  cur={x:p.x,y:p.y};
  token.classList.remove('cheer'); void token.getBoundingClientRect(); // restart animation
  token.classList.add('cheer');
  if(cheerTimer) clearTimeout(cheerTimer);
  cheerTimer=setTimeout(()=>token.classList.remove('cheer'),760);
  onDone&&onDone();
}

function runTravel(points,opts){
  opts=opts||{};
  if(anim) cancelAnimationFrame(anim);
  let pathPts;
  if(opts.snap){
    // 切換到某一天：鼠寶直接定位到該天路線起點，再跑完整條路（不從上一個位置繞回來）
    cur={...points[0]};
    token.setAttribute('transform',`translate(${cur.x},${cur.y})`);
    pathPts=points;
  }else{
    const start=points[0];
    pathPts=(Math.hypot(start.x-cur.x,start.y-cur.y)>14)?[{...cur},...points]:points;
  }
  travel.setAttribute('d',smoothPath(pathPts));
  const len=travel.getTotalLength();
  const end=points[points.length-1];
  const onDone=opts.onDone;
  if(len<6){ cheerInPlace(end,onDone); return; }              // 幾乎沒動 → 原地歡呼
  token.classList.remove('cheer');
  const dur=(len/SPEED)*1000;                                  // 固定速度 → 時長隨距離線性變化
  token.classList.add('moving');let t0=null;
  function frame(now){
    if(!t0)t0=now;let t=Math.min(1,(now-t0)/dur);const e=easeInOut(t);const dist=e*len;
    const p=travel.getPointAtLength(dist);const ahead=travel.getPointAtLength(Math.min(len,dist+2));
    const hop=Math.abs(Math.sin((dist/HOP_EVERY)*Math.PI))*HOP_H; // 跳動跟「走過距離」綁定
    token.setAttribute('transform',`translate(${p.x.toFixed(2)},${(p.y-hop).toFixed(2)})`);
    tokenLean.setAttribute('transform',`rotate(${Math.max(-9,Math.min(9,(ahead.x-p.x)*1.4)).toFixed(1)})`);
    if(t<1){anim=requestAnimationFrame(frame);}
    else{token.classList.remove('moving');tokenLean.setAttribute('transform','rotate(0)');cur={x:end.x,y:end.y};
      cheerInPlace(end,onDone); }                              // 抵達後也來個小歡呼
  }
  anim=requestAnimationFrame(frame);
}
function moveTokenTo(p){ runTravel([{...cur},p]); }
function runDay(points){ runTravel(points,{snap:true}); }

/* ---------------- DAY SWITCH ---------------- */
const activeRoute=$('#activeRoute'), activeRoad=$('#activeRoad');
const pHead=$('#pHead'), cardsEl=$('#cards'), panel=$('#panel');
let current='overview';

function setDay(key){
  current=key;
  const isOv = key==='overview';
  const hex = isOv?OV_HEX:META[key].hex;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('on',b.dataset.k===String(key)));
  panel.style.setProperty('--accent',hex);
  tokenFlag.setAttribute('fill',hex);

  if(isOv){
    activeRoute.setAttribute('d','');activeRoad.setAttribute('d','');
    document.querySelectorAll('.spot').forEach(g=>{g.classList.remove('dim','active','hl');g.querySelector('.pulse').setAttribute('opacity','0');});
    moveTokenTo(pt('yeondong'));
  }else{
    const dpath=smoothPath(ROUTES[key].map(pt));
    activeRoute.setAttribute('d',dpath);activeRoad.setAttribute('d',dpath);activeRoute.setAttribute('stroke',hex);
    document.querySelectorAll('.spot').forEach(g=>{const s=SPOTS[g.dataset.key];const inDay=s.kind==='hub'||s.day===key;
      g.classList.toggle('dim',!inDay);g.classList.toggle('active',s.day===key);g.classList.remove('hl');
      g.querySelector('.pulse').setAttribute('opacity',s.day===key?'':'0');});
    runDay(ROUTES[key].map(pt));
  }
  renderPanel(key);
}

function stars(s){
  if(!s.rate) return `<span class="rate none">✨ ${s.norate}</span>`;
  const rt=s.rate;
  return `<span class="rate" title="${rt.src}"><span class="star">★</span>${rt.r}<span class="cnt">(${rt.n})</span></span>`;
}
function comboCard(c){
  const oks=c.ok.map(([t,d])=>`<div class="cmb-row ok"><span class="cmb-tag">${t}</span><span class="cmb-d">${d}</span></div>`).join('');
  return `<div class="combo">
    <div class="cmb-h">⚖️ ${c.title}</div>
    <div class="cmb-sub">${c.sub}</div>
    ${oks}
    <div class="cmb-row bad"><span class="cmb-x">✗ 別這樣</span><span class="cmb-d">${c.bad}</span></div>
  </div>`;
}
function spotCard(key,delay){
  const s=SPOTS[key];
  const col = s.kind==='hub' ? '#7c8aa0' : DAY_HEX[s.day]||OV_HEX;
  const sc=SCENES[s.scene]||SCENES.hub;
  const badge = BADGE[s.kind] ? `<span class="chip kind" style="background:${s.kind==='alt'?'#9a8a6a':col}">${BADGE[s.kind]}</span>`:'';
  const srcLine = s.rate ? `<div class="src">${s.rate.src}</div>`:'';
  const tags=(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  return `<div class="scard" data-key="${key}" style="--c:${col};animation-delay:${delay}s">
    <div class="scard-photo" style="background:linear-gradient(150deg,${sc[0]},${sc[1]})">
      <span class="deco a">✦</span><span class="hero">${s.icon}</span><span class="deco b">❀</span>
      <span class="chip time">${s.time}</span>${badge}
    </div>
    <div class="scard-body">
      <div class="scard-top"><span class="sname">${s.name}</span>${stars(s)}</div>
      ${srcLine}
      <div class="tags">${tags}</div>
      <p class="sdesc">${s.desc}</p>
    </div></div>`;
}

function renderPanel(key){
  if(key==='overview'){
    pHead.innerHTML=`<div class="ph-top"><span class="ph-day">全程總覽</span><span class="ph-date">4 天 3 夜</span></div>
      <div class="ph-theme">🌸 繡球花 × 🌊 海景 × 🍴 吃吃喝喝</div>
      <div class="ph-note">點下面的卡片或下方 <b>Day 1–4</b>，看 🐭 鼠寶帶你跑當天路線。</div>`;
    cardsEl.innerHTML=[1,2,3,4].map((d,i)=>{const m=META[d];
      const cnt=m.spots.filter(k=>SPOTS[k].kind!=='hub').length;
      return `<div class="ovcard" data-day="${d}" style="--c:${m.hex};animation-delay:${i*0.06}s">
        <div class="ov-em">${d===1?'🛬':d===2?'🌸':d===3?'🌺':'🛫'}</div>
        <div><div class="ov-d">${m.label}　<span style="font-size:12px;color:var(--ink2);font-family:'Noto Sans TC'">${m.date}</span></div>
        <div class="ov-t">${m.theme}</div><div class="ov-s">${m.wx}　・　${cnt} 個點</div></div></div>`;}).join('');
    cardsEl.querySelectorAll('.ovcard').forEach(c=>c.addEventListener('click',()=>setDay(Number(c.dataset.day))));
    return;
  }
  const m=META[key];
  pHead.innerHTML=`<div class="ph-top"><span class="ph-day">${m.label}</span><span class="ph-date">${m.date}</span></div>
    <div class="ph-theme">${m.theme}</div><span class="ph-wx">${m.wx}</span>
    <div class="ph-note">${m.note}</div>`;
  const comboHtml = m.combo ? comboCard(m.combo) : '';
  cardsEl.innerHTML=comboHtml + m.spots.map((k,i)=>spotCard(k,i*0.05)).join('');
  cardsEl.querySelectorAll('.scard').forEach(c=>{
    const k=c.dataset.key;
    c.addEventListener('mouseenter',()=>hlSpot(k,true));
    c.addEventListener('mouseleave',()=>hlSpot(k,false));
    c.addEventListener('click',()=>{moveTokenTo(pt(k));});
  });
}

/* ---------- map<->card sync ---------- */
function focusCard(key,scroll){
  const card=cardsEl.querySelector(`.scard[data-key="${key}"]`);
  cardsEl.querySelectorAll('.scard').forEach(c=>c.classList.remove('focus'));
  if(card){card.classList.add('focus');if(scroll)card.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function unfocusCards(){cardsEl.querySelectorAll('.scard').forEach(c=>c.classList.remove('focus'));}
function hlSpot(key,on){const g=spotsG.querySelector(`.spot[data-key="${key}"]`);if(g)g.classList.toggle('hl',on);}

/* ---------------- SWITCHER ---------------- */
const sw=$('#switch');
[['overview','🗺️','全程','總覽'],[1,'🐭','Day 1','6/17'],[2,'🐭','Day 2','6/18'],[3,'🐭','Day 3','6/19'],[4,'🐭','Day 4','6/20']]
.forEach(([k,pin,d,sm])=>{
  const hex = k==='overview'?OV_HEX:META[k].hex;
  const b=document.createElement('button');b.className='day-btn';b.dataset.k=String(k);b.style.setProperty('--c',hex);
  b.innerHTML=`<span class="pin">${pin}</span><span class="db-d">${d}</span><span class="db-sm">${sm}</span>`;
  b.addEventListener('click',()=>setDay(k==='overview'?'overview':Number(k)));
  sw.appendChild(b);
});

/* keyboard */
const order=['overview',1,2,3,4];
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const i=order.indexOf(current);let ni=Math.max(0,Math.min(order.length-1,i+(e.key==='ArrowRight'?1:-1)));
  const nk=order[ni];setDay(nk==='overview'?'overview':Number(nk));
});

/* init */
setDay('overview');
</script>
</body>
</html>
